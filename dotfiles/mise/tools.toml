# Personal defaults. A project's mise.toml overrides these versions.
[tools]
node = "24"
bun = "1.4.2"
python = "3.14"
go = "1.27"
# Clojure needs a JDK; the Homebrew clojure formula does not bring one.
java = "temurin-25"
uv = "0.12.21"
"npm:pnpm" = "10.21.0"
"npm:@openai/codex" = "0.163.0"
"npm:@anthropic-ai/claude-code" = { version = "2.1.303", allow_builds = ["@anthropic-ai/claude-code"], npm_args = "--ignore-scripts=false" }
"npm:@opencode/cli" = { version = "2.0.32", allow_builds = ["@opencode/cli"], npm_args = "--ignore-scripts=false" }
"npm:@fsouza/prettierd" = "0.26.1"
"npm:prettier" = "3.6.2"
"npm:impeccable" = "2.1.8"
"npm:eas-cli" = "16.6.2"
"npm:0x" = "6.0.0"
"npm:clinic" = "13.0.0"

[settings.npm]
package_manager = "npm"
