# Personal defaults. A project's mise.toml overrides these versions.
[tools]
# Before node, so its npm comes ahead of the one bundled with Node on PATH.
"npm:npm" = "12.2.1"
node = "26"
bun = "1.4.4"
python = "3.14"
go = "1.27"
# Clojure needs a JDK; the Homebrew clojure formula does not bring one.
java = "temurin-25"
uv = "0.13.5"
"npm:pnpm" = "12.15.0"
# Not Claude Code, Codex, or opencode: T3 Code updates them, which it cannot do
# for a copy from mise. The fleet's work runner installs them in ~/.local/bin.
"npm:@fsouza/prettierd" = "0.29.0"
"npm:prettier" = "3.9.10"
"npm:impeccable" = "4.7.0"
"npm:eas-cli" = "25.3.0"
"npm:0x" = "6.0.0"
"npm:clinic" = "13.0.0"

[settings.npm]
package_manager = "npm"
